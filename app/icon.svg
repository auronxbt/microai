<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6ee7b7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="16" fill="url(#g)"/>
  <rect width="64" height="64" rx="16" fill="url(#glow)"/>

  <!-- Robot head shape -->
  <rect x="14" y="16" width="36" height="30" rx="10" fill="#020e06"/>

  <!-- Antenna -->
  <line x1="32" y1="16" x2="32" y2="9" stroke="#020e06" stroke-width="3" stroke-linecap="round"/>
  <circle cx="32" cy="7" r="3.2" fill="#020e06"/>

  <!-- Eyes: MA -->
  <text x="32" y="38" font-family="Arial, sans-serif" font-size="17" font-weight="900" fill="#34d399" text-anchor="middle" letter-spacing="0.5">MA</text>

  <!-- Bottom antenna dots (mouth/signal) -->
  <circle cx="24" cy="42" r="1.6" fill="#34d399" opacity="0.6"/>
  <circle cx="32" cy="42" r="1.6" fill="#34d399" opacity="0.6"/>
  <circle cx="40" cy="42" r="1.6" fill="#34d399" opacity="0.6"/>
</svg>
